name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[test]"
      - name: Tests (offline)
        env:
          CIVMAP_OFFLINE: "1"
        run: pytest -q
      - name: Gallery data is valid
        run: |
          python - <<'PY'
          import json, pathlib
          idx = json.loads(pathlib.Path("docs/countries.json").read_text())
          for c in idx:
              d = json.loads(pathlib.Path(f"docs/data/{c['iso2']}.json").read_text())
              assert d["meta"]["landHexes"] > 100, c
              print(c["iso2"], d["meta"]["name"], d["meta"]["landHexes"], "land hexes")
          PY
