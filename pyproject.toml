[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civmap"
version = "0.1.0"
description = "Render any country as a Civilization-style hex map from open data."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jatin Garg"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "shapely>=2.0", "pillow>=9", "requests>=2.28"]
keywords = ["map", "civilization", "hexagon", "open-data", "gis", "visualization"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
png = ["playwright>=1.40"]
test = ["pytest>=7"]

[project.scripts]
civmap = "civmap.cli:main"

[project.urls]
Homepage = "https://github.com/jatingargiitk/civmap"
Demo = "https://jatingargiitk.github.io/civmap/"

[tool.setuptools]
packages = ["civmap"]

[tool.setuptools.package-data]
civmap = ["viewer/*"]
